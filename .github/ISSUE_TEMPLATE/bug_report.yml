name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if an app's microphone list does not show your virtual
        device, please read docs/aggregate-device.md first — it is a known
        transport-type filter, not a bug.

  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: "macOS 15.5, Apple Silicon"
    validations:
      required: true

  - type: textarea
    id: devices
    attributes:
      label: Output of `./build/aggdev --list`
      render: shell
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command, or the GUI steps.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: If the problem is about an audio file
      description: Output of `file <path>` and `ffprobe <path>`
      render: shell
    validations:
      required: false
